<!-- We are using material card header -->
<mat-card-header
    *transloco="let locale"
    class="card-header twd-flex"
    [ngClass]="headerColor + ' ' + (widgetState.floating ? 'floating' : '') + ' ' + (widgetState.aot ? 'aot' : '')"
>
    <!-- We add a material icon from config of default a widget icon -->

    <!-- Add titile if provided in config or add widget by default -->
    <!-- <mat-card-title>{{ data.Name || 'Widget' }}</mat-card-title> -->
    <mat-card-title>
        <mat-icon *ngIf="data.Config.Icon.indexOf('custom') < 0">{{ data.Config.Icon || 'widgets' }}</mat-icon>
        <mat-icon *ngIf="data.Config.Icon.indexOf('custom') >= 0" [svgIcon]="data.Config.Icon"></mat-icon>
        <span>
            {{
                locale('widgets_common.header.title.' + data.Name) !== 'widgets_common.header.title.' + data.Name
                    ? locale('widgets_common.header.title.' + data.Name)
                    : data.Name
                      ? data.Name
                      : 'Widget'
            }}
        </span>
    </mat-card-title>

    <span class="spacer"></span>

    <!-- All the action buttons goes here -->

    <button
        *ngIf="data.Config.Actions.includes('resize')"
        [ngClass]="{ 'mat-warn': resizeMode, hidden: hideResizeButton }"
        [matTooltip]="resizeMode ? locale('wrapperComponent.cancelResize') : locale('wrapperComponent.resize')"
        (click)="!widgetState.maximized ? resizeWidget() : ''"
    >
        <mat-icon>aspect_ratio</mat-icon>
    </button>
    <!-- 
    <button *ngIf="data.Config.Actions.includes('pin')"  [matTooltip]="data.Config.Pinned ? 'Unpin' : 'Pin'">
        <mat-icon [ngClass]="{ 'rotate-45': data.Config.Pinned }">push_pin</mat-icon>
    </button> -->

    <button
        *ngIf="data.Config.Actions.includes('refresh')"
        [matTooltip]="locale('wrapperComponent.refresh')"
        (click)="refreshWidget()"
    >
        <mat-icon>refresh</mat-icon>
    </button>

    <button
        *ngIf="data.Config.Actions.includes('maximize') && !widgetState.floating && !widgetState.maximized"
        [matTooltip]="locale('wrapperComponent.maximize')"
        (click)="maximizeWidget()"
    >
        <mat-icon>fullscreen</mat-icon>
    </button>

    <button
        *ngIf="data.Config.Actions.includes('float') && !widgetState.floating && !widgetState.maximized"
        [matTooltip]="locale('wrapperComponent.float')"
        (click)="floatWidget()"
    >
        <mat-icon>open_in_new</mat-icon>
    </button>

    <button
        *ngIf="data.Config.Actions.includes('collapse') || widgetState.floating || widgetState.maximized"
        [matTooltip]="widgetState.collapsed ? locale('wrapperComponent.expand') : locale('wrapperComponent.collapse')"
        (click)="collapseWidget()"
    >
        <mat-icon [ngClass]="{ 'rotate-180': !widgetState.collapsed }">expand_more</mat-icon>
    </button>

    <button
        *ngIf="(widgetState.floating || widgetState.maximized) && !data.Config.Class.includes('no-restore')"
        [matTooltip]="locale('wrapperComponent.restore')"
        (click)="widgetState.floating ? floatWidget() : maximizeWidget()"
    >
        <mat-icon>fullscreen_exit</mat-icon>
    </button>

    <button
        *ngIf="data.Config.Actions.includes('destroy')"
        [matTooltip]="locale('wrapperComponent.close')"
        (click)="destroyAOTWidget()"
    >
        <mat-icon>close</mat-icon>
    </button>
</mat-card-header>
