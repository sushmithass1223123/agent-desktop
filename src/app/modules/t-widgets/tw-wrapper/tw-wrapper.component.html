<!-- Placeholder for float and maximized state -->
<div *ngIf="floating" class="widget-placeholder">
    {{ data.Name }}
</div>

<!-- Widget card -->
<tw-card
    cdkDrag
    [cdkDragBoundary]="aot ? '#container-2' : '.widget-grid'"
    [cdkDragDisabled]="maximized || (!floating && !aot)"
    [cdkDragFreeDragPosition]="dragPosition"
    class="tw-card animate__animated animate__faster {{
        data.Config.Class + ' ' + (data.Config.Static ? 'tw-static' : '') + ' ' + (maximized ? 'animate__zoomIn' : '')
    }}"
    [ngClass]="{ collapsed: collapsed, maximized: maximized, floating: floating, hidden: hidden, aot: aot, 'tw-flat': fuseConfig.flatTheme }"
    [ngStyle]="{ 'width.px': data.Config.Position.W, 'height.px': data.Config.Position.H }"
>
    <ng-container *ngIf="{ anchor: customFuseColor.anchor$ | async, widget: customFuseColor.widget$ | async } as fuseBgs">
        <!-- We are writing a wrapper over material card -->
        <mat-card
            class="widget-card"
            [ngClass]="
                (fuseBgs.anchor?.body || fuseBgs.widget?.body) +
                ' ' +
                (floating ? 'floating' : '') +
                ' ' +
                (data.Config.Static ? 'tw-static-card' : '')
            "
        >
            <!-- Wrapper to wrap header and body -->
            <div fxLayout="column" fxLayoutAlign=" none" class="card-wrapper" [ngClass]="data.Config.Static ? 'tw-static-card-wrapper' : ''">
                <!-- Enabled header if enabled in config -->
                <tw-card-header
                    [data]="data"
                    [fuseConfig]="fuseConfig"
                    *ngIf="data.Config.Header"
                    [widgetState]="{ maximized: maximized, floating: floating, collapsed: collapsed, aot: aot, pinned: pinned }"
                    (refresh)="refresh()"
                    (maximize)="maximize()"
                    (float)="float()"
                    (collapse)="collapse()"
                    (destroy)="destroy()"
                    cdkDragHandle
                ></tw-card-header>

                <!-- Card content -->
                <mat-card-content
                    [ngClass]="
                        (fuseBgs.anchor?.content || fuseBgs.widget?.content) +
                        ' ' +
                        (!data.Config.Header ? 'no-header' : '') +
                        ' ' +
                        (data.Config.Static ? 'tw-static-card-content' : '')
                    "
                >
                    <!-- All the card content goes here -->
                    <ng-content></ng-content>
                </mat-card-content>
            </div>
        </mat-card>
    </ng-container>
</tw-card>
