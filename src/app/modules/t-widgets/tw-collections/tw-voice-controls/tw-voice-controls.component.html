<tw-wrapper
    [data]="data"
    (maximizeEvent)="maximizeEvent.emit($event)"
    (collapseEvent)="collapseEvent.emit($event)"
    (floatEvent)="floatEvent.emit($event)"
>
    <div class="w-100-p h-100-p voice-controls" fusePerfectScrollbar [fusePerfectScrollbarOptions]="{ suppressScrollX: true }">
        <div fxFill fxLayout="row" fxLayoutAlign=" none">
            <div
                fxLayout="column"
                fxLayoutAlign=" center"
                class="w-60 h-100-p mr-4 pr-4 py-8 interactions"
                fusePerfectScrollbar
                [fusePerfectScrollbarOptions]="{ suppressScrollX: true }"
            >
                <avatar
                    *ngFor="let item of interactionList"
                    name="{{ item.user }}"
                    [ngClass]="item.status + ' ' + (item.interactionId === interactionId ? 'active' : '')"
                    matTooltip="{{ item.user }}"
                    matTooltipPosition="after"
                    (click)="selectInteraction(item)"
                ></avatar>
            </div>
            <div fxFlex fxLayout="column" fxLayoutAlign=" none">
                <div
                    fxFlex
                    fxLayout="column"
                    fxLayoutAlign=" none"
                    class="w-100-p px-12 py-8 border-radius-20 font-size-12 interaction-details"
                    [ngClass]="
                        fuseConfig.layout.anchorWidget.customBackgroundColor === true && data.Config.Anchor
                            ? fuseConfig.layout.anchorWidget.contentBackground
                            : fuseConfig.layout.widget.customBackgroundColor === true
                            ? fuseConfig.layout.widget.contentBackground
                            : ''
                    "
                >
                    <div fxFlex fxLayout="column" fxLayoutAlign="space-between none">
                        <div fxLayout="row" fxLayoutAlign="space-between none">
                            <div fxLayout="row" fxLayoutAlign=" center"><mat-icon>alarm_on</mat-icon> {{ startTime }}</div>
                            <div fxLayout="row" fxLayoutAlign=" center"><mat-icon>construction</mat-icon> {{ sessionID }}</div>
                        </div>
                        <div fxLayout="row" fxLayoutAlign="space-between none">
                            <span fxLayout="row" fxLayoutAlign=" center">
                                <mat-icon>timer</mat-icon> {{ (duration | date: 'H:mm:ss':'UTC') || '00:00:00' }}
                            </span>
                        </div>
                        <div fxLayout="column" fxLayoutAlign=" none">
                            <span fxLayout="row" fxLayoutAlign=" center">
                                <span>Verification Status: </span>
                                <span class="title text-bold ml-4">NA</span>
                            </span>
                            <span fxLayout="row" fxLayoutAlign=" center">
                                <span>Verification Type: </span>
                                <span class="title text-bold ml-4">NA</span>
                            </span>
                        </div>
                    </div>
                    <div
                        *ngIf="data.Data.IVR?.MenuEnabled"
                        fxLayout="row"
                        fxLayoutAlign=" none"
                        class="mt-8 px-12 border-radius-30 font-size-12 position-relative ivr-history"
                    >
                        <div class="label">IVR History</div>
                        <ul class="breadcrumbs">
                            <li>
                                <span>Main Menu</span>
                            </li>
                            <li>
                                <span>Products</span>
                            </li>
                            <li>
                                <span>Mobile</span>
                            </li>
                            <li>
                                <span>Agent</span>
                            </li>
                        </ul>
                    </div>
                </div>
                <div fxLayout="row" fxLayoutAlign=" none" class="call-controls">
                    <button
                        *ngIf="status !== 'disconnected'"
                        mat-flat-button
                        class="success"
                        [disabled]="status !== 'initial'"
                        #answerBtn
                        (click)="answerCall(answerBtn)"
                    >
                        <mat-icon>call</mat-icon>
                    </button>
                    <button
                        *ngIf="status !== 'disconnected'"
                        mat-flat-button
                        class="danger"
                        [disabled]="status !== 'connected'"
                        #disconnectBtn
                        (click)="disconnectCall(disconnectBtn)"
                    >
                        <mat-icon>call_end</mat-icon>
                    </button>
                    <button
                        *ngIf="status !== 'hold' && status !== 'disconnected'"
                        mat-flat-button
                        class="warning"
                        [disabled]="status !== 'connected'"
                        #holdBtn
                        (click)="holdCall(holdBtn)"
                    >
                        <mat-icon>phone_paused</mat-icon>
                    </button>
                    <button *ngIf="status === 'hold'" mat-flat-button class="success" #unHoldBtn (click)="unHoldCall(unHoldBtn)">
                        <mat-icon>phone_in_talk</mat-icon>
                    </button>
                    <button *ngIf="data.Data?.TransferAllowed && status !== 'disconnected'" mat-flat-button [disabled]="status !== 'connected'">
                        <mat-icon>phone_forwarded</mat-icon>
                    </button>
                    <button *ngIf="data.Data?.ConferenceAllowed && status !== 'disconnected'" mat-flat-button [disabled]="status !== 'connected'">
                        <mat-icon>group</mat-icon>
                    </button>
                    <button *ngIf="data.Data.IVR?.Transfer?.Allowed && status !== 'disconnected'" mat-flat-button [disabled]="status !== 'connected'">
                        <mat-icon>phonelink_ring</mat-icon>
                    </button>
                    <button
                        *ngIf="status === 'disconnected'"
                        mat-flat-button
                        class="border-radius-20 animate__animated animate__slideInRight animate__faster"
                        color="warn"
                        #closeBtn
                        (click)="closeInteraction(closeBtn)"
                        matTooltip="Close Interaction"
                    >
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- For web phone -->
    <div hidden>
        <audio *ngFor="let item of msAudioStreams" autoplay playsinline="true" [srcObject]="item.stream" id="{{ item.stream.id }}"></audio>
    </div>
</tw-wrapper>
