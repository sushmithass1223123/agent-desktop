<tw-wrapper [data]="data" (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)"
    (floatEvent)="floatEvent.emit($event)">
    <div fxFlex fxFill fxLayout="row" fxLayoutAlign="center center" class="tw-full" fusePerfectScrollbar>
        <span class="mat-headline mb-0">
            {{ data.Name }} widget!
        </span>
    </div>
</tw-wrapper>
