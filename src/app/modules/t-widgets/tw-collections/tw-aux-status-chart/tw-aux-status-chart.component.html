<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->
<tw-wrapper [data]="data" #wrapper>
    <!-- your code goes here -->
    <div
        *ngIf="statusChart.datasets.length >= 1 && statusChart.datasets[0].data.length"
        fxLayout="column"
        fxLayoutAlign="center center"
        class="w-100-p h-100-p"
    >
        <div *ngIf="wrapper.maximized" class="w-100-p h-10-p px-8" fxLayout fxLayoutAlign="end center">
            <mat-form-field fxFlex="30">
                <mat-label>Enter a date range</mat-label>
                <mat-date-range-input [rangePicker]="picker">
                    <input matStartDate placeholder="Start date" />
                    <input matEndDate placeholder="End date" />
                </mat-date-range-input>
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-date-range-picker #picker></mat-date-range-picker>
            </mat-form-field>
        </div>
        <div
            class="tw-chart w-100-p p-4"
            [ngClass]="{
                'h-90-p': wrapper.maximized,
                'h-100-p': !wrapper.maximized
            }"
            #chartContainerRef
        >
            <canvas
                baseChart
                [colors]="statusChart.colors"
                [datasets]="statusChart.datasets"
                [options]="statusChart.options"
                [labels]="statusChart.labels"
                [legend]="wrapper.maximized"
                chartType="pie"
            >
            </canvas>
            <!-- <div class="t-pie-chart-value">{{ widget.data[1].value }}</div> -->
        </div>
    </div>

    <div
        *ngIf="statusChart.datasets.length === 0 || (statusChart.datasets.length >= 1 && !statusChart.datasets[0].data.length)"
        class="w-100-p h-100-p text-center"
        fxLayout
        fxLayoutAlign="center center"
    >
        <p>No Data Available</p>
    </div>
    <!-- your code goes here -->
</tw-wrapper>
