<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->
<tw-wrapper [data]="data">
    <!-- your code goes here -->
    <div fxFill fxLayout="row wrap" class="p-12">
        <div fxFlex="100" fxLayout fxLayoutAlign="start center" class="mb-16">
            <div class="w-50-p" fxLayout fxLayoutAlign="start center">
                <div style="border-radius: 10px" class="w-40 h-40">
                    <img src="assets/images/vectors/positive-score.svg" class="w-100-p" />
                </div>
                <div class="ml-16">
                    <h4 class="m-0">
                        <strong> 84% </strong>
                    </h4>
                    <small> Positive </small>
                </div>
            </div>
            <div class="w-50-p">
                <mat-progress-bar mode="determinate" value="40"></mat-progress-bar>
            </div>
        </div>
        <div fxFlex="100" fxLayout fxLayoutAlign="start center" class="mb-16">
            <div class="w-50-p" fxLayout fxLayoutAlign="start center">
                <div style="border-radius: 10px" class="w-40 h-40">
                    <img src="assets/images/vectors/average-score.svg" class="w-100-p" />
                </div>
                <div class="ml-16">
                    <h4 class="m-0">
                        <strong> 84% </strong>
                    </h4>
                    <small> Average </small>
                </div>
            </div>
            <div class="w-50-p">
                <mat-progress-bar mode="determinate" value="40"></mat-progress-bar>
            </div>
        </div>
        <div fxFlex="100" fxLayout fxLayoutAlign="start center">
            <div class="w-50-p" fxLayout fxLayoutAlign="start center">
                <div style="border-radius: 10px" class="w-40 h-40">
                    <img src="assets/images/vectors/negative-score.svg" class="w-100-p" />
                </div>
                <div class="ml-16">
                    <h4 class="m-0">
                        <strong> 84% </strong>
                    </h4>
                    <small> Negative </small>
                </div>
            </div>
            <div class="w-50-p">
                <mat-progress-bar mode="determinate" value="40"></mat-progress-bar>
            </div>
        </div>
    </div>
    <!-- your code goes here -->
</tw-wrapper>
