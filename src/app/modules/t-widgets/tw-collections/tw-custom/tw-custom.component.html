<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->

<!-- PLEASE NOTE: do not add any other attributes or directive to 'tw-wrapper' selector -->

<tw-wrapper [data]="data" *ngIf="show" (refreshEvent)="onRefreshEvent()">
    <!-- your code goes here -->
    <div fxFlex fxFill fxLayout="row" fxLayoutAlign="center center">
        <div
            class="spinner"
            [ngClass]="{
                'border-radius-0': (customFuse$ | async).flatTheme
            }"
            *ngIf="!loaded"
        >
            <mat-spinner></mat-spinner>
        </div>

        <iframe
            *ngIf="url; else noURL"
            [src]="url"
            [id]="'tw_frame_' + data.ID"
            class="frame"
            [ngClass]="{ 'border-radius-0': (customFuse$ | async).flatTheme }"
            frameborder="0"
            seamless="seamless"
            (load)="frameLoaded($event)"
            allow="geolocation; microphone; camera;"
        ></iframe>

        <ng-template #noURL>
            <div fxFlex fxFill fxLayout="row" fxLayoutAlign="center center" *ngIf="!url">
                <span class="mat-display-1 mb-0"> Custom URL not found! </span>
            </div>
        </ng-template>
    </div>
    <!-- your code goes here -->
</tw-wrapper>
