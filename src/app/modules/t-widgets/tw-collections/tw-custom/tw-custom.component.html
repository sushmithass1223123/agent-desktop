<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->

<!-- PLEASE NOTE: do not add any other attributes or directive to 'tw-wrapper' selector -->

<tw-wrapper [data]="data">
    <!-- your code goes here -->
    <div fxFlex fxFill fxLayout="row" fxLayoutAlign="center center">
        <div class="spinner" *ngIf="!loaded">
            <mat-spinner></mat-spinner>
        </div>

        <div fxFlex fxFill fxLayout="row" fxLayoutAlign="center center" *ngIf="!url">
            <span class="mat-display-1 mb-0">
                Custom URL not found!
            </span>
        </div>

        <iframe *ngIf="url" [src]="url" class="frame" frameborder="0" seamless="seamless" allow="geolocation; microphone; camera;"></iframe>
    </div>
    <!-- your code goes here -->
</tw-wrapper>
