<ng-container *ngIf="{
        anchor: (customFuse.anchor$ | async),
        widget: (customFuse.widget$ | async),
        config: (customFuse.config$ | async)
    } as customFuse">
    <tw-wrapper [data]="data" (maximizeEvent)="onMaximized($event)" (collapseEvent)="collapseEvent.emit($event)"
        (floatEvent)="onFloated($event)" *transloco="let locale">
        <div class="smp-interaction-container twd-w-full twd-flex">
            <div class="interaction-avatar twd-flex twd-flex-col twd-pl-2">
                <div class="avatar-box twd-rounded-3xl twd-relative twd-flex active"
                    [ngClass]="customFuse.anchor?.content || customFuse.widget?.content">
                    <img class="twd-absolute social-tag" src="assets/images/vectors/facebook.svg" alt="">
                    <h5 class="font-weight-600">JA</h5>
                </div>
                <div class="avatar-box twd-rounded-3xl twd-relative twd-flex"
                    [ngClass]="customFuse.anchor?.content || customFuse.widget?.content">
                    <img class="twd-absolute social-tag" src="assets/images/vectors/instagram.svg" alt="">
                    <h5 class="font-weight-600">YK</h5>
                </div>
                <div class="avatar-box twd-rounded-3xl twd-relative twd-flex"
                    [ngClass]="customFuse.anchor?.content || customFuse.widget?.content">
                    <img class="twd-absolute social-tag" src="assets/images/vectors/x.svg" alt="">
                    <h5 class="font-weight-600">CR</h5>
                </div>
            </div>

            <div class="interaction-main sm-im-content twd-w-full twd-flex twd-flex-col twd-rounded-3xl twd-relative twd-p-3"
                [ngClass]="customFuse.anchor?.content || customFuse.widget?.content">
                <div class="social-info-action twd-w-full twd-flex twd-pb-3 bb">
                    <div class="s-info twd-flex">
                        <img src="assets/images/vectors/facebook.svg" alt="">
                        <h5 class="font-weight-700">Janet Archer</h5>
                    </div>
                    <div class="s-actions twd-flex">
                        <mat-icon role="button">reply</mat-icon>
                        <mat-icon role="button">save</mat-icon>
                        <mat-icon role="button">send</mat-icon>
                        <mat-icon role="button">close</mat-icon>
                    </div>
                </div>
                <smp-template [ngClass]="{ 'max-mode': isMaximizedMode }"
                    [hideStructureActions]="!isMaximizedMode"></smp-template>
                <div class="load-more twd-flex" *ngIf="!isMaximizedMode" role="button"
                    (click)="toggleInteractionPopup()">
                    <p>Load more</p>
                    <mat-icon>arrow_drop_down</mat-icon>
                </div>
            </div>

        </div>
    </tw-wrapper>

    <div class="interaction-popup twd-flex" *ngIf="popupInteraction">
        <div class="interaction-main twd-w-full twd-flex twd-flex-col twd-rounded-3xl twd-relative twd-p-3"
            [ngClass]="customFuse.anchor?.content || customFuse.widget?.content">
            <div class="social-info-action twd-w-full twd-flex twd-pb-3 bb">
                <div class="s-info twd-flex">
                    <img src="assets/images/vectors/facebook.svg" alt="">
                    <h5 class="font-weight-700">Janet Archer</h5>
                </div>
                <div class="s-actions twd-flex">
                    <mat-icon role="button">reply</mat-icon>
                    <mat-icon role="button">save</mat-icon>
                    <mat-icon role="button">send</mat-icon>
                    <mat-icon (click)="toggleInteractionPopup()" role="button">close</mat-icon>
                </div>
            </div>
            <smp-template></smp-template>
        </div>
    </div>
</ng-container>
