<tw-wrapper
    [data]="data"
    (maximizeEvent)="maximizeEvent.emit($event)"
    (collapseEvent)="collapseEvent.emit($event)"
    (floatEvent)="floatEvent.emit($event)"
>
    <div fxLayout class="w-100-p h-100-p px-12 py-8 border-radius-20 customer-info" fusePerfectScrollbar>
        <div *ngFor="let item of customerInfo" fxFlex="50">
            <span class="title text-bold"> {{ item.Title }}: </span>
            <span class="value">
                {{ (item.Value || item.DefaultValue) + item.Unit }}
            </span>
        </div>
    </div>
</tw-wrapper>
