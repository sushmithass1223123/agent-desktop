<tw-wrapper
    [data]="data"
    (maximizeEvent)="maximizeEvent.emit($event)"
    (collapseEvent)="collapseEvent.emit($event)"
    (floatEvent)="floatEvent.emit($event)"
    #wrapper
>
    <div class="h-100-p twd-overflow-auto">
        <div fxLayout="row wrap" class="w-100-p px-12 py-8 border-radius-20 customer-info custom-scroll-adjust">
            <div *ngFor="let item of customerInfo" fxFlex="50" class="line-height-30">
                <span class="title text-bold"> {{ item.Title }}: </span>
                <span class="value">
                    {{ item.Value ? item.Value + ' ' + item.Unit : item.DefaultValue }}
                </span>
            </div>
        </div>
    </div>
</tw-wrapper>
