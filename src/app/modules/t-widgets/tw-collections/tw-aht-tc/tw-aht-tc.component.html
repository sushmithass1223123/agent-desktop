<tw-wrapper twChart [data]="data" (maximizeEvent)="maximized = $event">
    <div *ngIf="data.Data?.Type === 'grid'" class="twd-w-full twd-h-full">
        <ad-table></ad-table>
    </div>

    <div *ngIf="data.Data?.Type === 'chart'" class="twd-w-full twd-h-full">
        <div
            *ngIf="ahtChart.datasets.length >= 1 && ahtChart.datasets[0].data.length"
            class="twd-flex twd-flex-col twd-justify-center twd-items-center twd-w-full twd-h-full animate__animated animate__zoomIn animate__faster"
        >
            <div class="tw-chart twd-w-full twd-h-full twd-p-2" #chartContainerRef>
                <canvas
                    baseChart
                    class="box-shadow-3d"
                    [colors]="ahtChart.colors"
                    [datasets]="ahtChart.datasets"
                    [options]="ahtChart.options"
                    [labels]="ahtChart.labels"
                    [legend]="ahtChart.legend"
                    chartType="doughnut"
                >
                </canvas>
                <!-- <div class="t-pie-chart-value">{{ widget.data[1].value }}</div> -->
            </div>
        </div>

        <div
            *ngIf="ahtChart.datasets.length === 0 || (ahtChart.datasets.length >= 1 && !ahtChart.datasets[0].data.length)"
            class="twd-flex twd-flex-col twd-justify-center twd-items-center twd-w-full twd-h-full twd-text-center"
        >
            <img src="assets/images/vectors/no-data-1.svg" class="twd-w-10/12 twd-h-10/12 box-shadow-3d" />
            <p class="text-center m-0" [ngClass]="{ 'mat-display-2': maximized, ' mat-title': !maximized }">No Data Available</p>
        </div>
    </div>
</tw-wrapper>
