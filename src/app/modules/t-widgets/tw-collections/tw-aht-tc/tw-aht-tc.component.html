<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->
<tw-wrapper twChart [data]="data" (maximizeEvent)="maximized = $event">
    <div *ngIf="widgetData.Type === 'grid'" class="w-100-p h-100-p">
        <ad-table [footer]="maximized ? 'show' : 'hide'"></ad-table>
    </div>

    <div *ngIf="widgetData.Type === 'chart'" class="w-100-p h-100-p">
        <div
            *ngIf="ahtChart.datasets.length >= 1 && ahtChart.datasets[0].data.length"
            fxLayout="column"
            fxLayoutAlign="center center"
            class="w-100-p h-100-p animate__animated animate__zoomIn animate__faster"
        >
            <div class="tw-chart w-100-p h-100-p p-8" #chartContainerRef>
                <canvas
                    baseChart
                    class="box-shadow-3d"
                    [colors]="ahtChart.colors"
                    [datasets]="ahtChart.datasets"
                    [options]="ahtChart.options"
                    [labels]="ahtChart.labels"
                    [legend]="ahtChart.legend"
                    chartType="doughnut"
                >
                </canvas>
                <!-- <div class="t-pie-chart-value">{{ widget.data[1].value }}</div> -->
            </div>
        </div>

        <div
            *ngIf="ahtChart.datasets.length === 0 || (ahtChart.datasets.length >= 1 && !ahtChart.datasets[0].data.length)"
            class="w-100-p h-100-p text-center"
            fxLayout="column"
            fxLayoutAlign="center center"
        >
            <img src="assets/images/vectors/no-data-1.svg" class="w-85-p h-85-p box-shadow-3d" />
            <p class="text-center m-0" [ngClass]="{ 'mat-display-2': maximized, ' mat-title': !maximized }">No Data Available</p>
        </div>
    </div>
</tw-wrapper>
