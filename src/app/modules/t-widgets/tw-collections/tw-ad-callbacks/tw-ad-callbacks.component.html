<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->
<tw-wrapper [data]="data" (maximizeEvent)="maximizeEvent($event)">
    <!-- your code goes here -->
    <div fxFlex fxFill fxLayout="row" fxLayoutAlign="space-between" class="w-100-p h-100-p p-4">
        <div class="callbacks" fxFlex="55" fusePerfectScrollbar>
            <div *ngFor="let x of sample" class="callback mb-20" fxLayout fxLayoutAlign="space-between center">
                <div fxFlex="65" fxLayout fxLayoutAlign="start center" fxLayoutGap="20px">
                    <button mat-flat-button mat-icon-button>
                        <mat-icon>
                            phone
                        </mat-icon>
                    </button>
                    <span>
                        Voice with Binny
                    </span>
                </div>
                <small fxFlex="30">
                    Aug 18, 2020, 11:34:34 AM
                </small>
            </div>
        </div>
        <div class="callback-total" fxFlex="40">
            <div class="handled p-10" fxLayout fxLayoutGap="15" fxLayoutAlign="space-between center">
                <span fxFlex="20">
                    <button mat-flat-button mat-icon-button>
                        <mat-icon>phone</mat-icon>
                    </button>
                </span>
                <strong fxFlex="50" class="ml-20">
                    <small *ngIf="!maximised">
                        Callbacks Handled
                    </small>
                    <span *ngIf="maximised">
                        Callbacks Handled
                    </span>
                </strong>
                <strong fxFlex="30" style="text-align: right;">
                    03
                </strong>
            </div>
            <div class="missed p-10" fxLayout fxLayoutGap="15" fxLayoutAlign="space-between center">
                <span fxFlex="20">
                    <button mat-flat-button mat-icon-button>
                        <mat-icon>call_end</mat-icon>
                    </button>
                </span>
                <strong fxFlex="50" class="ml-20">
                    <small *ngIf="!maximised">
                        Callbacks Missed
                    </small>
                    <span *ngIf="maximised">
                        Callbacks Missed
                    </span>
                </strong>
                <strong fxFlex="30" style="text-align: right;">
                    03
                </strong>
            </div>
        </div>
    </div>
    <!-- your code goes here -->
</tw-wrapper>
