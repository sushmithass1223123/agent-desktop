<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->
<tw-wrapper tChart [data]="data">
    <!-- your code goes here -->
    <div *ngIf="!loading" fxFlex fxFill fxLayout="row" class="h-100-p w-100-p p-8 p-relative">
        <canvas baseChart [datasets]="performanceChart.data" [labels]="performanceChart.labels" [options]="performanceChart.options" chartType="bar">
        </canvas>
    </div>

    <div *ngIf="loading" fxLayout fxLayouAlign="center center" class="w-100-p h-100-p">
        <mat-spinner></mat-spinner>
    </div>

    <!-- your code goes here -->
</tw-wrapper>
