<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->
<tw-wrapper twChart [data]="data" (maximizeEvent)="maximizeEvt($event)">
    <!-- your code goes here -->
    <div
        *ngIf="intentChart.datasets.length >= 1 && intentChart.datasets[0].data.length"
        fxLayout="column"
        fxLayoutAlign="center center"
        class="w-100-p h-100-p"
    >
        <div class="tw-chart w-100-p h-100-p p-4" #chartContainerRef>
            <canvas
                baseChart
                [colors]="intentChart.colors"
                [datasets]="intentChart.datasets"
                [options]="intentChart.options"
                [labels]="intentChart.labels"
                [legend]="maximized"
                [chartType]="'horizontalBar'"
            >
            </canvas>
            <!-- <div class="t-pie-chart-value">{{ widget.data[1].value }}</div> -->
        </div>
    </div>

    <div
        *ngIf="intentChart.datasets.length === 0 || (intentChart.datasets.length >= 1 && !intentChart.datasets[0].data.length)"
        class="w-100-p h-100-p text-center"
        fxLayout="column"
        fxLayoutAlign="center center"
    >
        <img src="assets/images/vectors/no-data-1.svg" class="w-100-p h-85-p box-shadow-3d" />
        <p class="text-center m-0" [ngClass]="{ 'mat-display-2': maximized, ' mat-title': !maximized }">No Data Available</p>
    </div>
    <!-- your code goes here -->
</tw-wrapper>
