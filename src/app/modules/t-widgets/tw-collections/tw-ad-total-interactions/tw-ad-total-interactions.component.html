<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->
<tw-wrapper [data]="data" (maximizeEvent)="allInteractionsChart.legend = $event">
    <!-- your code goes here -->
    <div fxLayout="column" fxLayoutAlign="center center" class="w-100-p h-100-p">
        <div class="tw-chart w-100-p h-100-p p-4" #chartContainerRef>
            <canvas
                baseChart
                [colors]="allInteractionsChart.colors"
                [datasets]="allInteractionsChart.datasets"
                [options]="allInteractionsChart.options"
                [labels]="allInteractionsChart.labels"
                [legend]="allInteractionsChart.legend"
                chartType="doughnut"
            >
            </canvas>
            <!-- <div class="t-pie-chart-value">{{ widget.data[1].value }}</div> -->
        </div>
    </div>
    <!-- your code goes here -->
</tw-wrapper>
