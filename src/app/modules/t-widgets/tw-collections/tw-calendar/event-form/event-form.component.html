<div class="dialog-content-wrapper">
    <mat-toolbar class="mat-primary m-0">
        <mat-toolbar-row fxFlex fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">{{ dialogTitle }}</span>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>
    </mat-toolbar>

    <div mat-dialog-content class="p-16 pb-0 m-0 custom-scroll-adjust">
        <form name="eventForm" [formGroup]="eventForm" class="event-form w-100-p" fxLayout="column" fxFlex>
            <mat-radio-group
                class="mb-16"
                formControlName="type"
                fxLayout
                fxLayoutAlign="space-around "
                (change)="event.type = $event.value; setValidators($event.value)"
                color="primary"
            >
                <mat-radio-button value="event">Event</mat-radio-button>
                <mat-radio-button value="executetask">Task</mat-radio-button>
            </mat-radio-group>

            <ng-container *ngIf="event.type === 'executetask'">
                <mat-form-field appearance="outline">
                    <mat-label>Select Task</mat-label>
                    <mat-select formControlName="taskType" #taskType>
                        <mat-option value="{{ item.Value }}" *ngFor="let item of data.TaskOptions">{{ item.Name }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <ng-container [ngSwitch]="taskType.value">
                    <mat-form-field appearance="outline" *ngSwitchCase="'changestate'">
                        <mat-label>Select Status</mat-label>
                        <mat-select formControlName="taskData">
                            <mat-option value="{{ item.Value }}" *ngFor="let item of auxCodes">{{ item.Name }}</mat-option>
                        </mat-select>
                    </mat-form-field>
                    <mat-form-field appearance="outline" *ngSwitchCase="'makecall'">
                        <mat-label>Enter Phone No.</mat-label>
                        <input matInput name="phoneNumber" formControlName="taskData" />
                    </mat-form-field>
                    <mat-form-field appearance="outline" *ngSwitchCase="'meeting'">
                        <mat-label>Enter Meeting Link</mat-label>
                        <input matInput name="meetingLink" formControlName="taskData" />
                        <button mat-icon-button matSuffix [cdkCopyToClipboard]="eventForm.get('taskData')?.value || ''" matTooltip="Copy">
                            <mat-icon>file_copy</mat-icon>
                        </button>
                    </mat-form-field>
                </ng-container>
            </ng-container>

            <mat-form-field appearance="outline" class="w-100-p" *ngIf="event.type === 'event' || event.type === 'text'">
                <mat-label>Title</mat-label>
                <input matInput name="title" formControlName="title" />
            </mat-form-field>

            <div fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row" formGroupName="color">
                <!-- <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                    <mat-label>Primary color</mat-label>

                    />
                </mat-form-field>

                <mat-form-field appearance="outline" class="pl-sm-8" fxFlex="50">
                    <mat-label>Secondary color</mat-label>
                    <input
                        matInput
                        class="secondary-color-input border-radius-4"

                    />
                </mat-form-field> -->
            </div>

            <!-- <div class="pb-32" fxFlex="1 0 auto" fxLayout="row">

                <mat-slide-toggle name="allDay" formControlName="allDay" class="mr-24" aria-label="All day">
                    All Day
                </mat-slide-toggle>

            </div> -->

            <div fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row">
                <mat-form-field appearance="outline" class="pr-sm-8 date-time-picker" fxFlex="50">
                    <mat-label>Reminder date</mat-label>
                    <input matInput [matDatepicker]="startDatePicker" name="start" [min]="minDate" formControlName="start" />
                    <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
                    <mat-datepicker #startDatePicker></mat-datepicker>
                </mat-form-field>

                <mat-form-field appearance="outline" class="pl-sm-8 no-errors-spacer date-time-picker" fxFlex="50">
                    <mat-label>Reminder time</mat-label>
                    <input matInput type="time" formControlName="startTime" />
                </mat-form-field>
            </div>

            <!-- <div fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row">

                <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                    <mat-label>End date</mat-label>
                    <input matInput [matDatepicker]="endDatePicker" name="end" formControlName="end">
                    <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
                    <mat-datepicker #endDatePicker></mat-datepicker>
                </mat-form-field>

                <mat-form-field appearance="outline" class="pl-sm-8 no-errors-spacer" fxFlex="50">
                    <mat-label>End time</mat-label>
                    <input matInput type="time" formControlName="endTime">
                </mat-form-field>

            </div> -->

            <mat-form-field appearance="outline" formGroupName="meta" class="w-100-p">
                <mat-label>Location</mat-label>
                <input matInput name="location" formControlName="location" />
            </mat-form-field>

            <mat-form-field appearance="outline" formGroupName="meta" class="w-100-p">
                <mat-label>Notes</mat-label>
                <textarea matInput formControlName="notes" mat-maxlength="250" max-rows="4"> </textarea>
            </mat-form-field>
            <p
                *ngIf="this.event.status?.toLowerCase() === 'completed' || this.event.status?.toLowerCase() === 'rejected'"
                class="twd-text-warn-default"
            >
                *{{ this.event.status }} event/task cannot be edited!
            </p>
        </form>
    </div>

    <div mat-dialog-actions class="m-0 p-16" fxLayout="row" fxLayoutAlign="end center">
        <button
            *ngIf="action === 'edit'"
            mat-button
            color="warn"
            class="mr-8"
            (click)="matDialogRef.close(['delete', eventForm])"
            aria-label="Delete"
            matTooltip="Delete"
        >
            DELETE
        </button>

        <button
            *ngIf="action !== 'edit'"
            mat-button
            color="primary"
            class="save-button"
            (click)="matDialogRef.close(eventForm)"
            [disabled]="eventForm.invalid"
            aria-label="ADD"
        >
            ADD
        </button>

        <button
            *ngIf="action === 'edit'"
            mat-button
            color="primary"
            class="save-button"
            (click)="matDialogRef.close(['save', eventForm])"
            [disabled]="eventForm.invalid || this.event.status?.toLowerCase() === 'completed' || this.event.status?.toLowerCase() === 'rejected'"
            aria-label="SAVE"
        >
            SAVE
        </button>
    </div>
</div>
