<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->
<tw-wrapper [data]="data" #wrapper (maximizeEvent)="maximizeEvent($event)">
    <ad-table
        *ngIf="wrapper.maximized ? { footer: 'show', columns: maxDisplayedColumns } : { footer: 'hide', columns: minDisplayedColumns } as tableConf"
        [footer]="tableConf.footer"
        [columns]="tableConf.columns"
        (actionReducer)="tableEvents($event)"
    ></ad-table>
</tw-wrapper>
