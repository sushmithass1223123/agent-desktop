<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->
<tw-wrapper [data]="data" fxLayout fxLayoutAlign="center center" (maximizeEvent)="maximizeEvent($event)">
    <div class="h-90-p w-100-p bg-inherit" fusePerfectScrollbar>
        <table
            mat-table
            [dataSource]="dataSource"
            matSort
            class="mat-elevation-z0"
            matSortActive="CallsInQueue"
            matSortDirection="asc"
            matSortDisableClear
        >
            <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

            <!-- Position Column -->
            <ng-container matColumnDef="Channel">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Channel</th>
                <td mat-cell *matCellDef="let element">
                    <mat-icon color="primary"> {{ element.Channel }} </mat-icon>
                </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="Status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                <td mat-cell *matCellDef="let element">
                    <div
                        class="status"
                        [ngClass]="{
                            active: element.Status === 'Active',
                            'on-hold': element.Status === 'OnHold',
                            closed: element.Status === 'Closed',
                            'w-40-p': maximised,
                            'w-70-p': !maximised
                        }"
                    >
                        <mat-icon>
                            {{ element.Status === 'OnHold' ? 'phone_paused' : element.Status === 'Active' ? 'phone' : 'call_end' }}
                        </mat-icon>
                    </div>
                </td>
            </ng-container>

            <!-- Weight Column -->
            <ng-container matColumnDef="Created Time">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Created Time</th>
                <td mat-cell *matCellDef="let element">
                    <small>
                        {{ element.CreatedTime | date: 'medium' }}
                    </small>
                </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="Active Time">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Active Time</th>
                <td mat-cell *matCellDef="let element">
                    <small>
                        {{ element.ActiveTime }}
                    </small>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <p *ngIf="dataSource.data.length === 0" class="text-center m-0 font-size-16">No data available</p>
    </div>
    <mat-paginator *ngIf="maximised" [pageSizeOptions]="maximised ? [30, 40, 50] : [3, 6, 12]" showFirstLastButtons></mat-paginator>
</tw-wrapper>
