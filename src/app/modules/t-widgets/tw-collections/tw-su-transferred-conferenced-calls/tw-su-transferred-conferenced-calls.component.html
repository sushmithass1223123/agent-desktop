<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->
<tw-wrapper [data]="data">
    <!-- your code goes here -->
    <div fxFlex fxFill fxLayout="row" fxLayoutAlign="center center">
        <span class="mat-subheading-2 mb-0 text-center">
            <!-- inorder to access the class variable use angular expression {{ data }} -->
            <ngx-charts-bar-vertical-stacked
                [view]="bar_chart.view"
                [scheme]="bar_chart.colorScheme"
                [results]="bar_chart.dataSource"
                [gradient]="bar_chart.gradient"
                [xAxis]="bar_chart.showXAxis"
                [yAxis]="bar_chart.showYAxis"
                [legend]="bar_chart.showLegend"
                [showXAxisLabel]="bar_chart.showXAxisLabel"
                [showYAxisLabel]="bar_chart.showYAxisLabel"
                [xAxisLabel]="bar_chart.xAxisLabel"
                [yAxisLabel]="bar_chart.yAxisLabel"
                [animations]="bar_chart.animations"
            >
            </ngx-charts-bar-vertical-stacked>
        </span>
    </div>
    <!-- your code goes here -->
</tw-wrapper>
