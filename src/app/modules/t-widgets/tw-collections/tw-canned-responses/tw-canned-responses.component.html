<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->

<!-- PLEASE NOTE: do not add any other attributes or directive to 'tw-wrapper' selector -->

<tw-wrapper [data]="data" *transloco="let locale">
    <mat-progress-bar *ngIf="loading" mode="query"></mat-progress-bar>
    <!-- your code goes here -->
    <div fxFill fxFlex fxLayout="column" fxLayoutAlign=" none" class="px-16 py-8">
        <div fxLayout="row" fxLayoutAlign="space-between center" class="w-100-p template-selector">
            <div fxFill fxFlex="50" class="mr-4">
                <mat-form-field fxFill class="custom select-box" appearance="outline">
                    <mat-select
                        [placeholder]="locale('widgets.cannedResponses.mode')"
                        [(ngModel)]="responseMode"
                        (selectionChange)="changeMode($event)"
                    >
                        <mat-option value="auto">{{ locale('widgets.cannedResponses.modeAuto') }}</mat-option>
                        <mat-option value="manual">{{ locale('widgets.cannedResponses.modeManual') }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <div fxFill fxFlex="50" class="mr-4">
                <mat-form-field fxFill class="custom select-box" appearance="outline">
                    <mat-select
                        [placeholder]="locale('sharedComponents.textTemplates.departments')"
                        [(ngModel)]="selectedDepartment"
                        (selectionChange)="onSelectDepartment($event)"
                        [disabled]="responseMode === 'auto'"
                    >
                        <mat-option>None</mat-option>
                        <mat-option *ngFor="let item of departments" [value]="item.ID">{{ item.Name }}</mat-option>
                    </mat-select>
                    <mat-error> {{ locale('sharedComponents.textTemplates.departmentRequired') }} </mat-error>
                </mat-form-field>
            </div>
            <div fxFill fxFlex="50">
                <mat-form-field fxFill class="custom select-box" appearance="outline">
                    <mat-select
                        [placeholder]="locale('sharedComponents.textTemplates.groups')"
                        [disabled]="!selectedDepartment && responseMode === 'manual'"
                        [(ngModel)]="selectedGroup"
                        (selectionChange)="onSelectGroups($event)"
                    >
                        <mat-option>None</mat-option>
                        <mat-option *ngFor="let item of groups" [value]="item.Name">{{ item.Name }}</mat-option>
                    </mat-select>
                    <mat-error> {{ locale('sharedComponents.textTemplates.groupRequired') }} </mat-error>
                </mat-form-field>
            </div>
        </div>
        <div fxLayout="row" class="w-100-p twd-mt-1 template-items">
            <div
                *ngIf="templates.length > 0"
                fxFlex="40"
                fxLayout="column"
                class="animate__animated animate__faster animate__slideInLeft custom-scroll-adjust"
            >
                <button
                    mat-flat-button
                    class="w-90-p mb-8 border-radius-10 template"
                    [color]="template === selectedTemplate ? 'primary' : ''"
                    *ngFor="let template of templates"
                    (click)="onTemplateSelect(template)"
                    [matTooltip]="template.Name"
                >
                    {{ template.Name }}
                </button>
            </div>
            <mat-form-field
                [fxFlex]="templates.length > 0 ? 60 : 100"
                floatLabel="never"
                appearance="outline"
                class="custom selected-template with-bg"
            >
                <textarea
                    fxFlex
                    [readonly]="!data.Data?.EditAllowed"
                    matInput
                    matAutosizeMinRows="1"
                    matTextareaAutosize
                    [placeholder]="locale('widgets.cannedResponses.messagePlaceholder')"
                    [(ngModel)]="templateText"
                    [disabled]="!selectedTemplate"
                ></textarea>
                <button
                    mat-raised-button
                    color="accent"
                    class="border-radius-20"
                    [disabled]="!selectedTemplate"
                    (click)="sendTemplate(selectedTemplate)"
                >
                    {{ locale('widgets.cannedResponses.select') }}
                </button>
            </mat-form-field>
        </div>
    </div>
    <!-- your code goes here -->
</tw-wrapper>
