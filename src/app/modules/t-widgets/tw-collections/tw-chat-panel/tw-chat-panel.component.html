<tw-wrapper [data]="data">
    <div fxFlex fxFill fxLayout="column" class="tw-static-panel">
        <ng-container *ngFor="let widget of widgets">
            <tw-chat-controls
                [data]="widget"
                *ngIf="widget.Type === 'tw-chat-controls'"
                [ngClass]="
                    widget.Type +
                    ' ' +
                    (maximized[widget.Type] || widget.Config.ViewState === 'maximize' ? 'maximized' : '') +
                    ' ' +
                    (collapsed[widget.Type] || widget.Config.ViewState === 'collapse' ? 'collapsed' : '') +
                    ' ' +
                    (floating[widget.Type] || widget.Config.ViewState === 'float' ? 'floating' : '')
                "
                (maximizeEvent)="onmaximized($event, widget.Type)"
                (collapseEvent)="onCollapsed($event, widget.Type)"
                (floatEvent)="onFloating($event, widget.Type)"
            >
            </tw-chat-controls>

            <tw-customer-details
                [data]="widget"
                *ngIf="widget.Type === 'tw-customer-details'"
                [ngClass]="
                    widget.Type +
                    ' ' +
                    (maximized[widget.Type] || widget.Config.ViewState === 'maximize' ? 'maximized' : '') +
                    ' ' +
                    (collapsed[widget.Type] || widget.Config.ViewState === 'collapse' ? 'collapsed' : '') +
                    ' ' +
                    (floating[widget.Type] || widget.Config.ViewState === 'float' ? 'floating' : '')
                "
                (maximizeEvent)="onmaximized($event, widget.Type)"
                (collapseEvent)="onCollapsed($event, widget.Type)"
                (floatEvent)="onFloating($event, widget.Type)"
            >
            </tw-customer-details>

            <tw-customer-journey
                [data]="widget"
                *ngIf="widget.Type === 'tw-customer-journey'"
                [ngClass]="
                    widget.Type +
                    ' ' +
                    (maximized[widget.Type] || widget.Config.ViewState === 'maximize' ? 'maximized' : '') +
                    ' ' +
                    (collapsed[widget.Type] || widget.Config.ViewState === 'collapse' ? 'collapsed' : '') +
                    ' ' +
                    (floating[widget.Type] || widget.Config.ViewState === 'float' ? 'floating' : '')
                "
                (maximizeEvent)="onmaximized($event, widget.Type)"
                (collapseEvent)="onCollapsed($event, widget.Type)"
                (floatEvent)="onFloating($event, widget.Type)"
            >
            </tw-customer-journey>
        </ng-container>
    </div>
</tw-wrapper>
