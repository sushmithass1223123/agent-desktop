<!-- widget wrapper, [data] attribute is must to send the widget data for the wrapper -->
<!-- implement following events in your component to access widget wrapper action events -->
<!-- (maximizeEvent)="maximizeEvent.emit($event)" (collapseEvent)="collapseEvent.emit($event)" (floatEvent)="floatEvent.emit($event)" -->

<!-- PLEASE NOTE: do not add any other attributes or directive to 'tw-wrapper' selector -->

<tw-wrapper [data]="data">
    <ng-container
        *ngIf="{
            anchor: (customFuse.anchor$ | async),
            widget: (customFuse.widget$ | async)
        } as customFuse"
    >
        <div
            class="w-100-p h-100-p chat-controls"
            *transloco="let locale"
            [ngClass]="customFuse.anchor?.content || customFuse.widget?.content"
        >
            <div
                *ngIf="chatTranscripts.length"
                fxLayout="row"
                fxLayoutAlign=" none"
                class="mt-4 w-100-p h-100-p chat-container"
            >
                <div fxLayout="column" fxLayoutAlign=" none" class="border-radius-20 chat-content">
                    <!-- CHAT CONTENT -->
                    <div class="chat-transcripts w-100-p custom-scroll-adjust" fxFlex="1 1 auto">
                        <!-- CHAT MESSAGES -->
                        <div class="chat-messages px-12">
                            <!-- MESSAGE -->
                            <div
                                *ngFor="let message of chatTranscripts; let i = index"
                                class="message-row"
                                [ngClass]="{
                                    me: message?.who === user.agentName,
                                    contact: message?.who !== user.agentName
                                }"
                            >
                                <div class="user-avatar contact" *ngIf="message?.who !== user.agentName">
                                    <mat-icon>person</mat-icon>
                                </div>
                                <div
                                    fxLayout="column"
                                    fxLayoutAlign="start start"
                                    class="bubble"
                                    [ngClass]="(message.who !== user.agentName ? customFuse.anchor?.content : '') + ' '"
                                >
                                    <div
                                        *ngIf="chatTranscripts[i - 1]?.who !== message.who"
                                        class="user-label twd-text-xs mb-4"
                                    >
                                        {{ message.who }}
                                    </div>

                                    <div class="message">
                                        <span [innerHTML]="message.message"></span>
                                        <!-- <span class="spacer"></span> -->
                                    </div>
                                </div>
                                <div class="user-avatar me" *ngIf="message?.who === user.agentName">
                                    <img src="assets/images/vectors/bot.svg" />
                                </div>
                            </div>
                            <!-- / MESSAGE -->
                        </div>
                        <!-- CHAT MESSAGES -->
                    </div>
                    <!-- / CHAT CONTENT -->
                </div>
            </div>

            <div *ngIf="!chatTranscripts.length" class="w-100-p h-85-p">
                <img src="assets/images/vectors/no-data-1.svg" class="w-100-p h-100-p box-shadow-3d" />
                <p class="text-center mat-title m-0">{{ locale('contentComponent.transcriptsNotFound') }}</p>
            </div>
        </div>
    </ng-container>
</tw-wrapper>
