<!-- <tw-wrapper [data]="data"> -->
<div class="tw-static-panel twd-flex twd-flex-col twd-gap-2 twd-grid-auto-rows-auto">
    <ng-container *ngFor="let widget of widgets">
        <tw-voice-controls
            [data]="widget"
            *ngIf="widget.Type === 'tw-voice-controls'"
            [class]="widget.Type"
            [ngClass]="{
                maximized: maximized[widget.Type],
                collapsed: collapsed[widget.Type],
                floating: floating[widget.Type],
                'twd-min-h-80': maximized[widget.Type]
            }"
            (maximizeEvent)="maximized[widget.Type] = $event"
            (collapseEvent)="collapsed[widget.Type] = $event"
            (floatEvent)="floating[widget.Type] = $event"
        >
        </tw-voice-controls>

        <tw-customer-details
            [data]="widget"
            *ngIf="widget.Type === 'tw-customer-details'"
            [class]="widget.Type"
            [ngClass]="{
                maximized: maximized[widget.Type],
                collapsed: collapsed[widget.Type],
                floating: floating[widget.Type]
            }"
            (maximizeEvent)="maximized[widget.Type] = $event"
            (collapseEvent)="collapsed[widget.Type] = $event"
            (floatEvent)="floating[widget.Type] = $event"
        >
        </tw-customer-details>

        <tw-customer-journey
            [data]="widget"
            *ngIf="widget.Type === 'tw-customer-journey'"
            [class]="widget.Type"
            [ngClass]="{
                maximized: maximized[widget.Type],
                collapsed: collapsed[widget.Type],
                floating: floating[widget.Type]
            }"
            (maximizeEvent)="maximized[widget.Type] = $event"
            (collapseEvent)="collapsed[widget.Type] = $event"
            (floatEvent)="floating[widget.Type] = $event"
        >
        </tw-customer-journey>
    </ng-container>
</div>
<!-- </tw-wrapper> -->
