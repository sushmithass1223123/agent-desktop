<!-- No interaction template -->
<twc-no-interaction *ngIf="interactions.length === 0" type="email"> </twc-no-interaction>

<!-- Interaction template -->
<ng-container *ngFor="let item of interactions; index as i">
    <!-- widget template -->
    <div class="tw-interaction tw-widget-container" [ngClass]="item.interactionId === activeInteraction ? 'active' : ''">
        <div fxFill fxFlex fxLayout="row wrap" fxLayoutAlign=" none">
            <!-- TODO -->
            <!-- [fxFlex.gt-md]="item.widgets.dynamic.length ? 33 : 100" -->
            <div fxFlex.gt-md="33">
                <tw-template class="static-widget-grid" *ngIf="item.widgets.static.length > 0" [widgets]="item.widgets.static"></tw-template>
            </div>
            <div fxFlex.gt-md="66">
                <tw-template class="dynamic-widget-grid" *ngIf="item.widgets.dynamic.length > 0" [widgets]="item.widgets.dynamic"></tw-template>
            </div>

            <div class="tw-aot-fab" cdkDrag cdkDragBoundary=".tw-widget-container" *ngIf="item.widgets.aot?.length > 0">
                <widget-fab [fabWidgets]="item.widgets.aot"></widget-fab>
            </div>
        </div>
    </div>
    <!-- No widget for interaction -->
    <twc-no-widgets class="twc-card" *ngIf="item.widgets.static.length === 0" type="email"></twc-no-widgets>
</ng-container>
