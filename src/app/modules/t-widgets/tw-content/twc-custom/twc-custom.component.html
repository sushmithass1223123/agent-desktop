<tw-wrapper [data]="widgetData" (refreshEvent)="onRefreshEvent()">
    <div fxFlex fxFill fxLayout="row" fxLayoutAlign="center center" class="position-relative">
        <div
            class="spinner"
            [ngClass]="{
                'border-radius-0': fuseConfig.flatTheme
            }"
            *ngIf="!loaded"
        >
            <mat-spinner></mat-spinner>
        </div>

        <div fxFlex fxFill fxLayout="row" fxLayoutAlign="center center" *ngIf="!url">
            <span class="mat-display-1 mb-0"> Custom URL not found! </span>
        </div>

        <iframe
            *ngIf="url; else noURL"
            [src]="url"
            [id]="'frame_' + data.ID"
            class="frame"
            [ngClass]="{
                'border-radius-0': fuseConfig.flatTheme
            }"
            frameborder="0"
            seamless="seamless"
            (load)="frameLoaded()"
            allow="geolocation; microphone; camera;"
        ></iframe>

        <ng-template #noURL>
            <div fxFlex fxFill fxLayout="row" fxLayoutAlign="center center" *ngIf="!url">
                <span class="mat-display-1 mb-0"> Custom URL not found! </span>
            </div>
        </ng-template>
    </div>
</tw-wrapper>
