<div class="tw-widget-container custom-scroll" [ngStyle]="{ 'width.px': screenWidth, 'height.px': screenHeight }" *ngIf="loaded">
    <div fxFill fxFlex fxLayout="row wrap" fxLayoutAlign=" none" *ngIf="dockerWidgets?.length">
        <tw-template class="widget-grid" [widgets]="dockerWidgets"></tw-template>
    </div>
    <twc-no-widgets class="twc-card" *ngIf="!dockerWidgets || dockerWidgets.length === 0" type="docker"></twc-no-widgets>
</div>
