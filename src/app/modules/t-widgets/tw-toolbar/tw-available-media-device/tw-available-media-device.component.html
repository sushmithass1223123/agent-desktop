<div fxLayout="row wrap" *transloco="let locale" fxLayoutAlign="space-around center">
    <button
        (menuOpened)="opened = true"
        (menuClosed)="opened = false"
        #menuTrigger="matMenuTrigger"
        [matMenuTriggerFor]="availableDevicesMenu"
        class="twd-flex"
        (click)="showAvailableDevices()"
    >
        <mat-icon class="twd-text-primary-400" [matTooltip]="locale('toolbarComponent.availableDevices')">
            headset_mic
        </mat-icon>
    </button>
    <!-- <mat-menu class="avl-device-menu" #availableDevicesMenu="matMenu" xPosition="before"> -->
    <ng-template *transloco="let locale" #availableDevicesMenu class="custom">
        <section class="twd-flex twd-flex-col avl-device-menu">
            <div class="twd-m-0 twd-w-full menu-header twd-flex twd-justify-between twd-items-center">
                <span class="twd-text-xl">{{ locale('toolbarComponent.availableDevices') }}</span>
                <button class="twd-flex" tabindex="-1" mat-dialog-close>
                    <mat-icon>close</mat-icon>
                </button>
            </div>

            <div *ngIf="stream" fxLayout fxLayoutAlign="center center">
                <video class="twd-h-full twd-w-full" autoplay [srcObject]="stream" #videoElm></video>
            </div>
            <div
                *ngIf="!mediaDeviceInfo.error && !mediaDeviceInfo.loading && mediaDeviceInfo.devices as mediaDevices"
                class="twd-flex twd-flex-col"
                [formGroup]="mediaSelectFormGroup"
            >
                <div fxLayout *ngFor="let device of mediaDevices | keyvalue" class="twd-flex twd-gap-1">
                    <mat-form-field fxFlex="100%">
                        <div matPrefix fxLayout fxLayoutAlign="center center" class="device-icon">
                            @switch (device.key) {
                                @case ('Mic') {
                                    <mat-icon color="primary">mic</mat-icon>
                                }
                                @case ('Speaker') {
                                    <mat-icon color="primary">headset</mat-icon>
                                }
                                @case ('Video') {
                                    <mat-icon color="primary">videocam</mat-icon>
                                }
                            }
                        </div>

                        <mat-select [placeholder]="'Select ' + device.key" [formControlName]="device.key">
                            <mat-option *ngFor="let myDevice of device.value" [value]="myDevice.deviceId">
                                {{ myDevice.label }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
            <div class="text-center mt-20 mat-title" *ngIf="mediaDeviceInfo.error || mediaDeviceInfo.loading">
                {{ mediaDeviceInfo.error || mediaDeviceInfo.loading }}
            </div>
        </section>
    </ng-template>
    <!-- </mat-menu> -->
</div>
