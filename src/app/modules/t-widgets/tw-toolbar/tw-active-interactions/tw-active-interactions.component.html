<div fxFlex fxFill fxLayout="row" fxLayoutAlign=" center" *ngIf="interactionList.length > 0">
    <ng-container *ngFor="let item of interactionList">
        <div
            fxLayout="row"
            class="voice grey-300 border-radius-30 p-4 mx-4"
            [ngClass]="{
                'mat-elevation-z1': item.status !== 'disconnected'
            }"
            *ngIf="item.type === 'voice'"
            [ngClass]="{
                'bg-warning': item.status === 'hold'
            }"
        >
            <div mat-card-avatar class="w-36 h-36" (click)="openInteraction(item)">
                <mat-icon>phone</mat-icon>
            </div>
            <div class="mx-8" fxLayout="row" fxLayoutAlign="center center">{{ item.user }}</div>
            <div>
                <button
                    *ngIf="item.status !== 'hold'"
                    [disabled]="item.status !== 'connected'"
                    mat-icon-button
                    class="w-36 h-36 custom-btn bg-warning"
                    #holdBtn
                    matTooltip="Hold"
                    (click)="holdUnHoldCall('hold', item, holdBtn)"
                >
                    <mat-icon>phone_paused</mat-icon>
                </button>
                <button
                    *ngIf="item.status === 'hold'"
                    [disabled]="item.otherData.tempCallRef"
                    mat-icon-button
                    class="w-36 h-36 custom-btn bg-success"
                    #unHoldBtn
                    matTooltip="Unhold"
                    (click)="holdUnHoldCall('unhold', item, unHoldBtn)"
                >
                    <mat-icon>phone_in_talk</mat-icon>
                </button>
                <button
                    [disabled]="item.status !== 'connected' && item.status !== 'outgoing'"
                    mat-icon-button
                    class="w-36 h-36 ml-4 custom-btn bg-danger"
                    #disconnectBtn
                    matTooltip="Disconnect"
                    (click)="disconnectCall(item, disconnectBtn)"
                >
                    <mat-icon>call_end</mat-icon>
                </button>
            </div>
        </div>

        <avatar
            class="mx-4 border-radius-100"
            [ngClass]="{
                'mat-elevation-z1': item.status !== 'disconnected'
            }"
            [matIcon]="item.otherData.icon || 'chat'"
            classes="w-44 h-44 border-radius-100"
            [matTooltip]="item.user"
            [circleColor]="item.status === 'disconnected' ? 'bg-danger' : item.status === 'hold' ? 'bg-warning' : 'twd-bg-primary-700'"
            [matBadge]="item.otherData.unreadCount || ''"
            matBadgePosition="after"
            (click)="openInteraction(item)"
            *ngIf="item.type === 'textchat'"
        ></avatar>
    </ng-container>
</div>
