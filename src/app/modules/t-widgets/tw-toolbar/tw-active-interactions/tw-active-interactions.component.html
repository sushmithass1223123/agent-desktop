<div fxFlex fxFill fxLayout="row" fxLayoutAlign=" center" *ngIf="interactionList.length > 0">
    <ng-container *ngFor="let item of interactionList">
        <div fxLayout="row" class="voice grey-300 border-radius-30 p-8" *ngIf="item.type === 'voice'">
            <div mat-card-avatar class="w-36 h-36" (click)="openInteraction(item)">
                <mat-icon>phone</mat-icon>
            </div>
            <div class="mx-8" fxLayout="row" fxLayoutAlign="center center">{{ item.user }}</div>
            <div>
                <button
                    *ngIf="item.status !== 'hold'"
                    [disabled]="item.status !== 'connected'"
                    mat-icon-button
                    class="w-36 h-36 hold"
                    #holdBtn
                    (click)="holdCall(item, holdBtn)"
                >
                    <mat-icon>phone_paused</mat-icon>
                </button>
                <button *ngIf="item.status === 'hold'" mat-icon-button class="w-36 h-36 unhold" #unHoldBtn (click)="unHoldCall(item, unHoldBtn)">
                    <mat-icon>phone_in_talk</mat-icon>
                </button>
                <button
                    [disabled]="item.status !== 'connected'"
                    mat-icon-button
                    class="w-36 h-36 ml-4 drop"
                    #disconnectBtn
                    (click)="disconnectCall(item, disconnectBtn)"
                >
                    <mat-icon>call_end</mat-icon>
                </button>
            </div>
        </div>

        <avatar
            class="mx-4"
            matIcon="{{ item.user === 'Customer' ? 'person' : null }}"
            name="{{ item.user }}"
            classes="w-44 h-44 border-radius-100"
            matTooltip="{{ item.user }}"
            circleColor="#5A4980"
            matBadge="{{ item.otherData.unreadCount || '' }}"
            matBadgePosition="after"
            (click)="openInteraction(item)"
            *ngIf="item.type === 'textchat'"
        ></avatar>
    </ng-container>
</div>
