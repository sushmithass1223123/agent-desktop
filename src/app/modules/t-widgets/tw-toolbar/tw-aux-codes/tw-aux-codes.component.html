<div class="" *transloco="let locale">
    <button
        mat-icon-button
        class="aux-codes-btn"
        [ngClass]="{ opened: opened }"
        [matMenuTriggerFor]="menu"
        (menuOpened)="opened = true"
        (menuClosed)="opened = false"
        aria-label="AUX Codes dropdown"
        [matTooltip]="locale('toolbarComponent.auxCodes')"
    >
        <mat-icon>expand_more</mat-icon>
    </button>
</div>

<mat-menu class="custom" #menu="matMenu" xPosition="before">
    <ng-container *ngFor="let item of auxCodesList">
        <button
            *ngIf="item.Display === 1"
            mat-menu-item
            (click)="changeStatus(item)"
            disabled="{{ item.Name === currentAux || item.Code === 'nodata' }}"
        >
            <!-- class="{{ item.Code.toLowerCase() }}" -->
            <mat-icon
                [ngClass]="
                    item.Code.includes('Available')
                        ? 'text-alt-success'
                        : item.Code.includes('Logout') || item.Code.includes('On Call')
                        ? 'text-alt-danger'
                        : 'text-alt-warning'
                "
            >
                {{ item.Code.toLowerCase() === 'available' ? 'check_circle' : item.Code === 'logout' ? 'settings_power' : 'remove_circle' }}
            </mat-icon>
            <span>{{ item.Name }}</span>
        </button>
    </ng-container>
</mat-menu>
