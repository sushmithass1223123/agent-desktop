<div fxFlex fxFill fxLayout="row" fxLayoutAlign="start center" *ngIf="agentData.agentName">
    <button
        mat-button
        class="user-button"
        [ngClass]="{ opened: opened }"
        (menuOpened)="opened = true"
        (menuClosed)="opened = false"
        [matMenuTriggerFor]="userMenu"
        fxLayout="column"
        fxLayoutAlign="center center"
    >
        <div fxLayout="row" fxLayoutAlign="center center" class="position-relative">
            <img
                class="avatar mr-0 mat-elevation-z3"
                [style.backgroundImage]="'url(' + (agentData.profilePicture ? agentData.profilePicture : 'assets/images/avatars/profile.jpg') + ')'"
                *ngIf="data.Data.ProfilePicture"
                [ngClass]="
                    agentData.agentStatus.includes('Available')
                        ? 'border-sm-alt-success'
                        : agentData.agentStatus.includes('On Call')
                        ? 'border-sm-alt-danger'
                        : 'border-sm-alt-warning'
                "
            />
            <span
                class="element-status"
                [ngClass]="
                    agentData.agentStatus.includes('Available')
                        ? 'bg-alt-success'
                        : agentData.agentStatus.includes('On Call')
                        ? 'bg-alt-danger'
                        : 'bg-alt-warning'
                "
            ></span>
        </div>
    </button>

    <mat-menu #userMenu="matMenu" [overlapTrigger]="false" class="agent-info-menu custom">
        <button mat-menu-item fxLayout fxLayoutAlign=" center" matTooltip="Lan ID">
            <mat-icon>view_agenda</mat-icon>
            <span>{{ agentData.lanId }}</span>
        </button>

        <button mat-menu-item fxLayout fxLayoutAlign=" center" matTooltip="Agent ID">
            <mat-icon>perm_identity</mat-icon>
            <span>{{ agentData.agentId }}</span>
        </button>

        <button mat-menu-item *ngIf="agentData.agentProfile" fxLayout fxLayoutAlign=" center" matTooltip="Agent Profile">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>{{ agentData.agentProfile === 'S' ? 'Supervisor' : 'Agent' }}</span>
        </button>

        <button mat-menu-item *ngIf="agentData.lanId !== agentData.deviceId" fxLayout fxLayoutAlign=" center" matTooltip="Station ID">
            <mat-icon>phonelink_setup</mat-icon>
            <span>{{ agentData.deviceId }}</span>
        </button>

        <button mat-menu-item *ngIf="agentData.teamName" fxLayout fxLayoutAlign=" center" matTooltip="Team Name">
            <mat-icon>people_alt</mat-icon>
            <span> {{ agentData.teamName }} </span>
        </button>

        <button mat-menu-item *ngIf="agentData.isMSAgent" fxLayout fxLayoutAlign=" center">
            <mat-icon>phonelink</mat-icon>
            <span>Webphone</span>
        </button>

        <button mat-menu-item class="twd-flex twd-items-center twd-gap-x-1" (click)="openEmailSelectorDialog(emailSelector)">
            <span
                *ngIf="!mailboxes.form.controls.default.value"
                class="twd-animate-ping twd-absolute twd-inline-flex twd-h-1.5 twd-w-1.5 twd-rounded-full twd-bg-primary-default twd-opacity-75"
            ></span>
            <mat-icon>mail</mat-icon>
            <span> {{ mailboxes.form.controls.default.value || 'Select a mailbox' }} </span>
            <mat-icon>chevron_right</mat-icon>

            <ng-template #emailSelector>
                <div class="twd-text-xl twd-flex twd-items-center twd-gap-2 twd-font-bold twd-mb-4">
                    <mat-icon>settings</mat-icon>
                    Email Settings
                </div>
                <!-- <div class="twd-flex twd-flex-col twd-h-full"> -->
                <div class="twd-grid twd-grid-cols-1" [formGroup]="mailboxes.form">
                    <mat-form-field appearance="outline">
                        <mat-select placeholder="Send Email As" formControlName="default">
                            <mat-option *ngFor="let mailbox of mailboxes.available" [value]="mailbox">{{ mailbox }}</mat-option>
                        </mat-select>
                        <mat-error *ngIf="mailboxes.form.controls.default.errors" class="twd-text-red-400 twd-text-xs twd-font-bold">
                            Please select a sender account
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-select placeholder="Receive emails for" formControlName="selected" multiple>
                            <mat-select-trigger>
                                <ng-container *ngIf="mailboxes.form.controls.selected?.value as selectedMailboxes">
                                    {{ selectedMailboxes ? selectedMailboxes[0] : '' }}
                                    <span *ngIf="selectedMailboxes?.length > 1">
                                        (+{{ selectedMailboxes.length - 1 }} {{ selectedMailboxes?.length === 2 ? 'other' : 'others' }})
                                    </span>
                                </ng-container>
                            </mat-select-trigger>
                            <mat-option *ngFor="let mailbox of mailboxes.available" [value]="mailbox">{{ mailbox }}</mat-option>
                        </mat-select>
                    </mat-form-field>

                    <button
                        mat-raised-button
                        color="primary"
                        [matTooltip]="mailboxes.form.controls.default.errors ? 'Please select a sender sccount' : ''"
                        [disabled]="mailboxes.form.controls.default.errors"
                        (click)="composeEmail()"
                    >
                        Compose New Email
                    </button>
                </div>
                <!-- <div class="twd-flex-1">
                        <create-email (sendEmail)="sendEmail($event)" [from]="mailboxes.form.controls.default?.value"> </create-email>
                    </div> -->

                <!-- </div> -->
            </ng-template>
        </button>
    </mat-menu>

    <div
        fxLayout="column"
        fxLayoutAlign="center start"
        class="p-4 agent-details"
        matRipple
        [matRippleDisabled]="!auxCodeConfig.Enabled"
        [matMenuTriggerFor]="auxCodeConfig.Enabled && auxMenu"
        [ngClass]="{
            opened: auxOpened,
            auxCode: auxCodeConfig.Enabled
        }"
        (menuOpened)="auxOpened = true"
        (menuClosed)="auxOpened = false"
    >
        <span class="mat-body-2 m-0 w-90-p text-truncate mr-12 line-height-24">{{ agentData.agentName }}</span>
        <span class="mat-caption w-90-p text-truncate" *ngIf="data.Data.Status">{{ agentData.agentStatus }}</span>
        <mat-icon *ngIf="auxCodeConfig.Enabled" class="arrow-icon s-24" fxHide.xs>keyboard_arrow_down</mat-icon>
    </div>

    <mat-menu class="custom" #auxMenu="matMenu" xPosition="before">
        <button
            mat-menu-item
            *ngFor="let item of auxCodesList"
            (click)="changeStatus(item)"
            disabled="{{ item.Name === agentData.agentStatus || item.Code === 'nodata' }}"
        >
            <mat-icon class="{{ item.Code.toLowerCase() }}">
                {{ item.Code.toLowerCase() === 'available' ? 'check_circle' : item.Code === 'logout' ? 'settings_power' : 'remove_circle' }}
            </mat-icon>
            <span>{{ item.Name }}</span>
        </button>
    </mat-menu>
</div>
