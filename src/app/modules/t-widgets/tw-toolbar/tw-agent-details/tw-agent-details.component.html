<div fxFlex fxFill fxLayout="row" fxLayoutAlign="start center" *ngIf="agentData.agentName">
    <button mat-button class="user-button" [matMenuTriggerFor]="userMenu">
        <div fxLayout="row" fxLayoutAlign="center center" class="position-relative">
            <img
                class="avatar mr-0 mr-16"
                [style.backgroundImage]="'url(' + (agentData.profilePicture ? agentData.profilePicture : 'assets/images/avatars/profile.jpg') + ')'"
                *ngIf="data.Data.ProfilePicture"
                [ngClass]="
                    agentData.agentStatus.includes('Available')
                        ? 'border-sm-alt-success'
                        : agentData.agentStatus.includes('On Call')
                        ? 'border-sm-alt-danger'
                        : 'border-sm-alt-warning'
                "
            />
            <span
                class="element-status"
                [ngClass]="
                    agentData.agentStatus.includes('Available')
                        ? 'bg-alt-success'
                        : agentData.agentStatus.includes('On Call')
                        ? 'bg-alt-danger'
                        : 'bg-alt-warning'
                "
            ></span>
            <div fxLayout="column" fxLayoutAlign="center start" class="agent-details">
                <span class="username mr-12 line-height-24">{{ agentData.agentName }}</span>
                <span class="font-size-14 mat-caption agent-status" *ngIf="data.Data.Status">{{ agentData.agentStatus }}</span>
            </div>
        </div>
    </button>

    <mat-menu #userMenu="matMenu" [overlapTrigger]="false">
        <button mat-menu-item>
            <mat-icon>account_circle</mat-icon>
            <span>My Profile</span>
        </button>

        <button mat-menu-item class="">
            <mat-icon>mail</mat-icon>
            <span>Inbox</span>
        </button>

        <button mat-menu-item class="">
            <mat-icon>exit_to_app</mat-icon>
            <span>Logout</span>
        </button>
    </mat-menu>
</div>
