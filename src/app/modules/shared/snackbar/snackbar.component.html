<div fxFlayout fxLayoutAlign="space-between center">
    <span> {{ data.message }} </span>
    <mat-icon
        [ngClass]="{
            spin: data.loading,
            'text-primary': data.color === 'info' || data.color === 'loading',
            'text-success': data.color === 'success',
            'text-warning': data.color === 'warning',
            'text-danger': data.color === 'failure'
        }"
    >
        {{ data.icon }}
    </mat-icon>
</div>
