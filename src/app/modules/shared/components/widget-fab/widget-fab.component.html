<div class="fab-container">
    <button mat-fab color="primary" class="fab-toggler" (click)="onToggleFab()">
        <mat-icon [@fabToggler]="{ value: fabTogglerState }" class="s-30">add</mat-icon>
        <!-- Animation here -->
    </button>
    <div [@widgetStagger]="buttons.length">
        <!-- and here -->
        <ng-container *ngFor="let btn of buttons">
            <button
                mat-mini-fab
                color="secondary"
                *ngIf="btn.Config.Enabled && !btn.Config.Hidden"
                class="fab-secondary"
                (click)="openAOTWidget(btn)"
            >
                <mat-icon [matTooltip]="btn.Name || 'Widget'">{{ btn.Config.Icon || 'widgets' }}</mat-icon>
            </button>
        </ng-container>
    </div>
</div>
