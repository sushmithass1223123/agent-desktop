        <p class="text-center mat-title m-0 my-4 line-height-28 message">{{ data.title }}</p>
    </div>
    <div mat-dialog-content fxLayout="column" fxLayoutAlign="center center" class="m-0">
        <p class="text-center m-0 mb-4 line-height-28 mat-subheading-2 message" [innerHTML]="data.message"></p>

        <div fxLayoutAlign="center center" class="p-12 pb-12">
            <button mat-raised-button mat-icon-button class="bg-success mr-12" matTooltip="Accept" (click)="data.accept()">
                <mat-icon>done</mat-icon>
            </button>

            <button
                *ngIf="data.type !== 'tcmwqvoice' && data.type !== 'reminder'"
                mat-raised-button
                mat-icon-button
                class="bg-danger mr-12"
                matTooltip="Reject"
                (click)="data.reject()"
            >
                <mat-icon>close</mat-icon>
            </button>

            <button
                *ngIf="data.type !== 'tcmwqvoice' && !snoozeTimerTypes.includes(data.type)"
                mat-raised-button
                mat-icon-button
                class="bg-warning"
                matTooltip="Snooze"
                (click)="data.snooze()"
            >
                <mat-icon>pending_actions</mat-icon>
            </button>

            <button
                *ngIf="snoozeTimerTypes.includes(data.type)"
                mat-raised-button
                mat-icon-button
                class="bg-warning"
                matTooltip="Snooze"
                [matMenuTriggerFor]="menu"
            >
                <mat-icon>pending_actions</mat-icon>
            </button>

            <mat-menu class="custom" #menu="matMenu">
                <button mat-menu-item *ngFor="let item of snoozeTimer" (click)="data.snooze(item)">
                    <mat-icon>timer</mat-icon>
                    <span>{{ item }} min</span>
                </button>
            </mat-menu>
        </div>
    </div>
</div>
