<div #createEmail fxLayout="column" class="w-100-p h-100-p twd-overflow-y-auto">
    <form *ngIf="!quickReply" class="twd-mb-2" novalidate>
        <div class="border-primary border-radius-20 w-100-p p-12">
            <div [formGroup]="emailRecipientFacade">
                <div *ngIf="emailInfo?.From">
                    <div>
                        <span class="twd-font-bold twd-mr-1"> From: </span>
                        {{ emailInfo.From }}
                    </div>
                </div>
                <div class="twd-my-2 twd-flex twd-justify-between twd-gap-2" *ngIf="!hiddenFields?.includes('To')">
                    <label for="toField" class="font-weight-700 twd-pt-1">To : </label>
                    <div class="twd-flex-1 twd-flex">
                        <ng-container *ngTemplateOutlet="recipientInputField; context: { key: 'To' }"></ng-container>
                        <span class="twd-cursor-pointer twd-text-xs twd-font-bold twd-pt-1" (click)="showCcBcc = !showCcBcc"> CC/BCC </span>
                    </div>
                </div>
                <small *ngIf="emailRecipientFacade.controls.To.errors" class="twd-text-red-600"> To Email Address required </small>

                <ng-container *ngIf="showCcBcc">
                    <div class="twd-my-2 twd-flex twd-justify-between twd-gap-2">
                        <label for="ccField" class="font-weight-700 twd-pt-1">CC : </label>
                        <ng-container *ngTemplateOutlet="recipientInputField; context: { key: 'CC' }"></ng-container>
                    </div>

                    <div class="twd-my-2 twd-flex twd-justify-between twd-gap-2">
                        <label for="bccField" class="font-weight-700 twd-pt-1">BCC : </label>
                        <ng-container *ngTemplateOutlet="recipientInputField; context: { key: 'BCC' }"></ng-container>
                    </div>
                </ng-container>
            </div>

            <div class="twd-my-2 twd-flex twd-justify-between" *ngIf="!hiddenFields?.includes('Subject')">
                <label for="subjectField" class="twd-pt-1">
                    <span class="font-weight-700 twd-pr-2"> Subject : </span>
                    <span class="twd-border-b twd-border-primary-default twd-pb-1">
                        {{ replyTag }}
                    </span>
                </label>
                <input id="subjectField" class="flex-1 my-2" matInput [(ngModel)]="email.Subject" name="Subject" />
            </div>
        </div>
    </form>

    <div *ngIf="email.Files.length" class="twd-w-full twd-mb-2 twd-rounded-2xl twd-overflow-hidden twd-text-xs attachment-list">
        <mat-chip-list>
            <mat-chip
                *ngFor="let file of email.Files | slice: 0:2"
                removable
                class="border-radius-20 twd-flex twd-items-center twd-justify-between"
                [matTooltip]="file.Name"
                (click)="openFile(file.URL)"
                (removed)="removeFiles(file.Id)"
            >
                <span class="twd-max-w-10/12 twd-flex-1 twd-truncate twd-flex twd-items-center">
                    <mat-icon class="custom" color="primary" [svgIcon]="file.Icon"></mat-icon>
                    <span class="twd-truncate twd-ml-2"> {{ file.Name }} </span>
                </span>
                <mat-icon matChipRemove>cancel</mat-icon>
            </mat-chip>
            <mat-chip
                *ngIf="email.Files.length > 2"
                class="border-radius-20 m-4 twd-cursor-pointer"
                [matMenuTriggerFor]="attachList"
                matTooltip="Show More"
            >
                +{{ email.Files.length - 2 }}
            </mat-chip>
        </mat-chip-list>

        <mat-menu class="custom attachment-overlay" #attachList="matMenu">
            <div class="attachment-menu">
                <mat-chip-list class="mat-chip-list-stacked">
                    <mat-chip
                        *ngFor="let file of email.Files | slice: 2:email.Files.length"
                        removable
                        class="border-radius-20 twd-flex twd-items-center twd-justify-between"
                        [matTooltip]="file.Name"
                        (click)="openFile(file.URL)"
                        (removed)="removeFiles(file.Id)"
                    >
                        <div class="twd-max-w-10/12 twd-flex-1 twd-flex twd-items-center">
                            <mat-icon class="custom" color="primary" [svgIcon]="file.Icon"></mat-icon>
                            <span class="twd-truncate twd-ml-2"> {{ file.Name }} </span>
                        </div>
                        <mat-icon matChipRemove>cancel</mat-icon>
                    </mat-chip>
                </mat-chip-list>
            </div>
        </mat-menu>
    </div>

    <div class="email-editor-container border-primary flex-1 twd-flex twd-flex-col border-radius-20 twd-mb-2 twd-overflow-hidden">
        <div class="twd-flex-1 editor-wrapper position-relative twd-overflow-hidden">
            <div class="h-100-p w-100-p twd-absolute twd-top-0 twd-left-0">
                <kendo-editor class="twd-h-full" [(ngModel)]="email.Body" name="body">
                    <kendo-toolbar [overflow]="true" class="twd-shadow-sm">
                        <kendo-toolbar-buttongroup>
                            <kendo-toolbar-button kendoEditorUndoButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorRedoButton></kendo-toolbar-button>
                        </kendo-toolbar-buttongroup>
                        <kendo-toolbar-buttongroup>
                            <kendo-toolbar-button kendoEditorBoldButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorItalicButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorUnderlineButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorStrikethroughButton></kendo-toolbar-button>
                        </kendo-toolbar-buttongroup>
                        <kendo-toolbar-buttongroup>
                            <kendo-toolbar-button kendoEditorSubscriptButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorSuperscriptButton></kendo-toolbar-button>
                        </kendo-toolbar-buttongroup>
                        <kendo-toolbar-buttongroup>
                            <kendo-toolbar-button kendoEditorAlignLeftButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorAlignCenterButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorAlignRightButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorAlignJustifyButton></kendo-toolbar-button>
                        </kendo-toolbar-buttongroup>
                        <kendo-toolbar-dropdownlist kendoEditorFormat></kendo-toolbar-dropdownlist>
                        <kendo-toolbar-dropdownlist kendoEditorFontSize></kendo-toolbar-dropdownlist>
                        <kendo-toolbar-dropdownlist kendoEditorFontFamily></kendo-toolbar-dropdownlist>
                        <kendo-toolbar-colorpicker kendoEditorForeColor></kendo-toolbar-colorpicker>
                        <kendo-toolbar-colorpicker kendoEditorBackColor view="gradient"></kendo-toolbar-colorpicker>
                        <kendo-toolbar-buttongroup>
                            <kendo-toolbar-button kendoEditorInsertUnorderedListButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorInsertOrderedListButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorIndentButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorOutdentButton></kendo-toolbar-button>
                        </kendo-toolbar-buttongroup>
                        <kendo-toolbar-buttongroup>
                            <kendo-toolbar-button kendoEditorCreateLinkButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorUnlinkButton></kendo-toolbar-button>
                        </kendo-toolbar-buttongroup>
                        <kendo-editor-insert-table-button></kendo-editor-insert-table-button>
                        <kendo-toolbar-buttongroup>
                            <kendo-toolbar-button kendoEditorAddColumnBeforeButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorAddColumnAfterButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorAddRowBeforeButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorAddRowAfterButton></kendo-toolbar-button>
                        </kendo-toolbar-buttongroup>
                        <kendo-toolbar-buttongroup>
                            <kendo-toolbar-button kendoEditorDeleteColumnButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorDeleteRowButton></kendo-toolbar-button>
                            <kendo-toolbar-button kendoEditorDeleteTableButton></kendo-toolbar-button>
                        </kendo-toolbar-buttongroup>
                        <!-- <kendo-toolbar-button kendoEditorInsertFileButton></kendo-toolbar-button> -->
                        <!-- <kendo-toolbar-button kendoEditorInsertImageButton></kendo-toolbar-button> -->
                        <!-- <kendo-toolbar-button kendoEditorViewSourceButton></kendo-toolbar-button> -->
                        <!-- <kendo-toolbar-button kendoEditorCleanFormattingButton></kendo-toolbar-button> -->
                    </kendo-toolbar>
                </kendo-editor>
                <!-- <textarea [id]="editorState.id" class="twd-invisible"> </textarea> -->
            </div>
            <!-- <div
                *ngIf="editorState.loading"
                class="twd-absolute twd-bg-white twd-bg-opacity-25 twd-w-full twd-h-full twd-z-10 twd-flex twd-items-center twd-justify-center"
            >
                <p class="twd-text-lg twd-font-bold twd-text-center">Loading editor ...</p>
            </div> -->
        </div>
    </div>

    <div class="twd-flex twd-justify-between twd-px-2 twd-pb-2">
        <div>
            <email-template-selector (selectTemplate)="selectTemplate($event)"></email-template-selector>
            <button mat-raised-button mat-icon-button color="primary" class="mx-4" matTooltip="Attach file" (click)="attachFileRef.click()">
                <mat-icon>attach_file</mat-icon>
                <input #attachFileRef type="file" (click)="$event.target.value = null" (change)="onFileInput($event)" style="display: none" />
            </button>
        </div>
        <button
            mat-raised-button
            color="primary"
            class="mx-4 border-radius-20"
            matTooltip="Send Email"
            [disabled]="sendDisabled"
            (click)="triggerEmailSend()"
        >
            <span class="twd-pr-2"> Send </span>
            <!-- <mat-icon>send</mat-icon> -->
        </button>
    </div>
</div>

<ng-template let-key="key" #recipientInputField>
    <mat-chip-list class="twd-w-full twd-flex-1 twd-flex twd-flex-wrap" #chipList>
        <mat-chip *ngFor="let email of email[key]" class="twd-my-0 twd-min-h-auto" selectable removable (removed)="remove(key, email)">
            <span class="twd-truncate">
                {{ email }}
            </span>
            <mat-icon matChipRemove>cancel</mat-icon>
        </mat-chip>
        <input [formControl]="emailRecipientFacade.get(key)" matInput [matAutocomplete]="suggestedUsersRef" class="my-2 twd-flex-1" />
    </mat-chip-list>
    <mat-autocomplete autoActiveFirstOption #suggestedUsersRef="matAutocomplete" (optionSelected)="select(key, $event)">
        <mat-option *ngFor="let user of suggestedUsers" [value]="user">
            {{ user }}
        </mat-option>
    </mat-autocomplete>
</ng-template>
