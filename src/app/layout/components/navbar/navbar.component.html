<div class="navbar-header"
    [ngClass]="fuseConfig.layout.navbar.customBackgroundColor === true ? fuseConfig.layout.navbar.background : ''">
    <div class="logo" *ngIf="customerLogo?.Small.Src">
        <img class="logo-icon" [src]="customerLogo?.Small.Src" [alt]="customerLogo?.Alt"
            [width]="customerLogo?.Small.Width || 50" [height]="customerLogo?.Small.Height || 50" />
    </div>
</div>

<div class="navbar-content" fusePerfectScrollbar [fusePerfectScrollbarOptions]="{suppressScrollX: true}"
    [ngClass]="fuseConfig.layout.navbar.customBackgroundColor === true ? fuseConfig.layout.navbar.background : ''">

    <div class="twn-list">
        <mat-selection-list #sidebarList [multiple]="false">

            <div class="top">

                <mat-list-option *ngFor="let item of topWidgets" [value]="item" (click)="selectTab(item)"
                    [selected]="item.Data.Active" matTooltip="{{ item.Name }}" matTooltipPosition="after"
                    matTooltipClass="tooltip">

                    <mat-icon class="icon" mat-list-icon>{{item.Data.Icon}}</mat-icon>

                </mat-list-option>

                <mat-divider *ngIf="topWidgets.length > 0"></mat-divider>
            </div>

            <div class="bottom">
                <mat-divider *ngIf="bottomWidgets.length > 0"></mat-divider>

                <mat-list-option *ngFor="let item of bottomWidgets" [value]="item" (click)="selectTab(item)"
                    [selected]="item.Data.Active" matTooltip="{{ item.Name }}" matTooltipPosition="after"
                    matTooltipClass="tooltip">

                    <mat-icon class="icon" mat-list-icon>{{item.Data.Icon}}</mat-icon>

                </mat-list-option>
            </div>

            <button mat-button class="button-settings" (click)="toggleSidebarOpen('themeOptionsPanel')">
                <mat-icon class="icon">settings</mat-icon>
            </button>

        </mat-selection-list>

        <img class="brand-logo" [src]="brandLogo?.Small.Src || 'assets/images/logos/tetherfi-logo-round.png'"
            [alt]="brandLogo?.Alt || 'Tetherfi'" [width]="brandLogo?.Small.Width || 50"
            [height]="brandLogo?.Small.Height || 50" />

    </div>

</div>
