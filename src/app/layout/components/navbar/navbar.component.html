<div class="navbar-header" [ngClass]="(customFuse$ | async).background">
    <div class="logo" *ngIf="customerLogo?.Small.Src">
        <img
            class="logo-icon"
            [src]="customerLogo?.Small.Src"
            [alt]="customerLogo?.Alt"
            [width]="customerLogo?.Small.Width || 50"
            [height]="customerLogo?.Small.Height || 50"
        />
    </div>
</div>

<div class="navbar-content" [ngClass]="(customFuse$ | async).background">
    <div class="twn-list">
        <mat-selection-list #sidebarList [multiple]="false">
            <div
                class="top"
                fxLayout="column"
                fxLayoutAlign="start center"
                [ngClass]="{
                    'border-top border-bottom py-4': topWidgets.length > 0
                }"
            >
                <ng-container *ngFor="let item of topWidgets">
                    <mat-list-option
                        *ngIf="item.Config.Enabled"
                        [value]="item.Data.Path"
                        (click)="selectTab(item)"
                        #sidebarListOption
                        [selected]="item.Data.Active"
                        [matTooltip]="item.Name"
                        matTooltipPosition="after"
                        matTooltipClass="tooltip"
                    >
                        <mat-icon class="icon" mat-list-icon [matBadge]="item.Data.Count || ''">{{ item.Config.Icon || 'widgets' }}</mat-icon>
                    </mat-list-option>
                </ng-container>
            </div>

            <div
                class="bottom custom-scroll-adjust"
                fxLayout="column"
                fxLayoutAlign="start center"
                [ngClass]="{
                    'border-top border-bottom py-4': bottomWidgets.length > 0
                }"
            >
                <ng-container *ngFor="let item of bottomWidgets">
                    <mat-list-option
                        *ngIf="item.Config.Enabled"
                        [value]="item.Data.Path"
                        (click)="selectTab(item)"
                        #sidebarListOption
                        [selected]="item.Data.Active"
                        [matTooltip]="item.Name"
                        matTooltipPosition="after"
                        matTooltipClass="tooltip"
                    >
                        <mat-icon class="icon" mat-list-icon>{{ item.Config.Icon || 'widgets' }}</mat-icon>
                    </mat-list-option>
                </ng-container>
            </div>

            <button mat-button class="button-settings" (click)="toggleSidebarOpen('themeOptionsPanel')">
                <mat-icon class="icon">settings</mat-icon>
            </button>
        </mat-selection-list>

        <img
            class="brand-logo"
            [src]="brandLogo?.Small.Src || 'assets/images/logos/tetherfi-logo-round.png'"
            [alt]="brandLogo?.Alt || 'Tetherfi'"
            [width]="brandLogo?.Small.Width || 50"
            [height]="brandLogo?.Small.Height || 50"
        />
    </div>
</div>
