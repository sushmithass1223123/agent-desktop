    <mat-list class="date" cdkFocusRegionStart>
        <h3 matSubheader cdkFocusInit>
            <span>Today</span>
        </h3>

        <div class="secondary-text mat-display-1 mb-0 p-16">
            <div class="mb-12">
                {{ date | date: 'EEEE' }}
            </div>
            <div fxLayout="row" fxLayoutAlign="start start">
                <span> {{ date | date: 'd' }}</span>
                <span class="mat-subheading-1">th</span>
                <span> {{ date | date: 'MMMM' }}</span>
            </div>
        </div>
    </mat-list>

    <mat-divider cdkFocusRegionEnd></mat-divider>

    <mat-list>
        <h3 matSubheader>
            <span>Quick Settings</span>
        </h3>

        <mat-list-item>
            <mat-slide-toggle
                fxFlex
                class="mat-primary"
                [(ngModel)]="settings.desktopAlert"
                (change)="updateSettings('desktopAlert', $event.checked)"
                aria-label="Notifications"
                labelPosition="before"
            >
                <h3>Browser Notifications</h3>
            </mat-slide-toggle>
        </mat-list-item>

        <mat-list-item>
            <mat-slide-toggle
                fxFlex
                class="mat-primary"
                [(ngModel)]="settings.sounds"
                (change)="updateSettings('sounds', $event.checked)"
                aria-label="Notifications"
                labelPosition="before"
            >
                <h3>Notifications Sound</h3>
            </mat-slide-toggle>
        </mat-list-item>
    </mat-list>

    <mat-divider></mat-divider>

    <mat-list>
        <h3 matSubheader>
            <span>Pinned Widgets</span>
        </h3>
        <div class="p-16 pt-0">
            <ng-container *ngFor="let widget of pinnedAOTs">
                <button
                    mat-mini-fab
                    color="secondary"
                    *ngIf="widget.Config.Enabled"
                    class="fab-secondary mr-8 mb-8"
                    [matTooltip]="widget.Name || 'Widget'"
                    (click)="openAOTWidget(widget)"
                >
                    <mat-icon>{{ widget.Config.Icon || 'widget' }}</mat-icon>
                </button>
            </ng-container>
            <button
                mat-mini-fab
                color="primary"
                class="fab-secondary mr-8 mb-8"
                (click)="openAddLink = !openAddLink"
                matTooltip="Add New Link"
                cdkOverlayOrigin
                #addLink="cdkOverlayOrigin"
            >
                <mat-icon [@fabToggler]="{ value: openAddLink ? 'active' : 'inactive' }">add</mat-icon>

                <ng-template
                    cdkConnectedOverlay
                    [cdkConnectedOverlayOrigin]="addLink"
                    [cdkConnectedOverlayOpen]="openAddLink"
                    cdkConnectedOverlayHasBackdrop
                    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
                    (overlayOutsideClick)="openAddLink = false"
                    [cdkConnectedOverlayPositions]="[{ originX: 'end', originY: 'bottom', overlayX: 'end', overlayY: 'top' }]"
                >
                    <mat-card class="add-link-card">
                        <mat-card-header>
                            <mat-card-title>Add New Link</mat-card-title>
                        </mat-card-header>
                        <mat-card-content fxLayout="column" fxLayoutAlign="start none">
                            <div fxLayout="row" fxLayoutAlign="start center">
                                <div class="text-bold w-80">Name:</div>
                                <mat-form-field fxFlex appearance="outline" class="custom with-bg with-border">
                                    <input matInput required placeholder="Name" [(ngModel)]="linkName" />
                                    <mat-error> Link name is required </mat-error>
                                </mat-form-field>
                            </div>

                            <div fxLayout="row" fxLayoutAlign="start center" class="mt-4">
                                <div class="text-bold w-80">URL:</div>
                                <mat-form-field fxFlex floatLabel="never" appearance="standard" class="link-txt mb-8 border-radius-20 border-xs-info">
                                    <textarea
                                        [(ngModel)]="newLink"
                                        matInput
                                        matTextareaAutosize
                                        matAutosizeMinRows="3"
                                        matAutosizeMaxRows="5"
                                        placeholder="Enter URL Here..."
                                    ></textarea>
                                </mat-form-field>
                            </div>
                        </mat-card-content>
                        <mat-card-actions fxLayout="row" fxLayoutAlign="end center">
                            <button mat-raised-button color="primary" (click)="addNewLink()" [disabled]="!linkName && !newLink">ADD</button>
                            <button mat-button color="warn" (click)="openAddLink = false">CANCEL</button>
                        </mat-card-actions>
                    </mat-card>
                </ng-template>
            </button>
        </div>
    </mat-list>

    <mat-divider></mat-divider>
</div>
