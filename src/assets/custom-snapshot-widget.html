<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #image {
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            height: 100%;
            overflow: auto;
            display: flex;
            flex-wrap: wrap;
        }
    </style>

</head>

<body>
    <div id="images"> </div>
</body>

<script>
    const imageDom = document.getElementById('images')
    window.addEventListener("message", (res) => {
        if (event.origin != window.location.origin) return;
        const attachments = res.data.data.filter(x => x.EventName === "TextChatMessageReceivedEvent").map(x => {
            try {
                const msg = JSON.parse(x.Message);
                console.log({ msg })
                return msg
            } catch (e) { }
        })

        attachments.filter(x => x && (x.eventName === "ActionMessage")).forEach(msg => {
            // const newImage = new Image(100, 100);
            // newImage.style.margin = '15px';
            // newImage.src = msg.
            // imageDom.appendChild(newImage)
            const newEl = document.createElement('div');
            newEl.innerText = msg.data?.filename || '';
            newEl.style.margin = '10px';
            newEl.style.padding = '10px';
            newEl.style.borderRadius = '10px'
            newEl.style.background = 'lightgreen';
            imageDom.appendChild(newEl)
            console.debug('ActionMessages in iframe : ', msg)
        })
    })
</script>

</html>
